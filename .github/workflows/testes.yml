name: testes

on:
  pull_request:
  push:
    branches: [main]

jobs:
  teste:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mudebem
          POSTGRES_PASSWORD: mudebem
          POSTGRES_DB: mudebem_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mudebem -d mudebem_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://mudebem:mudebem@localhost:5432/mudebem_test?schema=public
      TEST_DATABASE_URL: postgresql://mudebem:mudebem@localhost:5432/mudebem_test?schema=public
      AUTH_SECRET: ci-auth-secret-com-mais-de-16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
