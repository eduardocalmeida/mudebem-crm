services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: mudebem
      POSTGRES_PASSWORD: mudebem
      POSTGRES_DB: mudebem
    ports:
      - "5432:5432"
    volumes:
      - mudebem_pg:/var/lib/postgresql/data
      - ./docker/init-databases.sql:/docker-entrypoint-initdb.d/02-test-db.sql:ro

volumes:
  mudebem_pg:
